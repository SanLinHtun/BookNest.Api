services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: booknest
      POSTGRES_USER: booknest
      POSTGRES_PASSWORD: ${BOOKNEST_DB_PASSWORD:?Set BOOKNEST_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - booknest-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknest -d booknest"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  booknest-data:
